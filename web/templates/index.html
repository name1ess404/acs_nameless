<!DOCTYPE html>
<html>
<head>
    <title>YouTube Downloader</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f4; }
        .container { background: white; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .instruction { color: #555; margin-bottom: 20px; font-style: italic; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #cc0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 YouTube MP3 Downloader</h1>
        
        <p class="instruction">Note: After clicking download, please check your 'downloads' folder for the MP3 files.</p>

        <form method="POST">
            <input type="text" name="url" placeholder="Paste YouTube link here..." required>
            <button type="submit">Download</button>
        </form>
    </div>
</body>
</html>
